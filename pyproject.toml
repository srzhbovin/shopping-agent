[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shopping-cart-agent"
version = "0.2.0"
description = "Проверяемая основа агента для подбора товарной корзины"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langfuse>=3.3,<5",
  "langgraph>=1.0,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "qdrant-client>=1.13,<1.15",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
shopping-agent = "shopping_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shopping_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=shopping_agent --cov-report=term-missing --cov-fail-under=75"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
