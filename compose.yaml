services:
  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 3s
      timeout: 2s
      retries: 20

  api:
    build: .
    ports:
      - "${API_PORT:-8010}:8000"
    environment:
      CATALOG_DB_PATH: /app/data/catalog.db
      DEMO_DATA_PATH: /app/data/demo
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: products_v1
      EMBEDDING_BASE_URL: http://host.docker.internal:1234/v1
      EMBEDDING_MODEL: text-embedding-nomic-embed-text-v1.5
      LLM_BASE_URL: http://host.docker.internal:1234/api/v1
      LLM_MODEL: qwen/qwen3.5-4b
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-55}"
      LLM_MAX_OUTPUT_TOKENS: "${LLM_MAX_OUTPUT_TOKENS:-128}"
      LLM_MAX_RETRIES: "${LLM_MAX_RETRIES:-1}"
      PROMPT_PATH: /app/prompts
      AGENT_MAX_STEPS: "${AGENT_MAX_STEPS:-12}"
      AGENT_MAX_TOOL_CALLS: "${AGENT_MAX_TOOL_CALLS:-30}"
      AGENT_TOKEN_BUDGET: "${AGENT_TOKEN_BUDGET:-1200}"
      AGENT_TIMEOUT_SECONDS: "${AGENT_TIMEOUT_SECONDS:-90}"
      AGENT_MAX_CRITIC_REVISIONS: "${AGENT_MAX_CRITIC_REVISIONS:-2}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_HOST: "${LANGFUSE_HOST:-http://host.docker.internal:3000}"
      AUTO_LOAD_DEMO: "true"
    volumes:
      - catalog_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s

volumes:
  qdrant_data:
  catalog_data:
